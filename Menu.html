<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu | NekoCafé</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">🐾 NekoCafé</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="menu.html">Menu</a></li>
                    <li class="nav-item"><a class="nav-link" href="reservas.html">Reservas</a></li>
                    <li class="nav-item"><a class="nav-link" href="contactos.html">Contactos</a></li>
                </ul>
            </div>
        </div>
    </nav>


    <div class="menu-header-bg p-5 text-center text-white mb-5">
    <h1 class="display-4 fw-bold">O Nosso Menu</h1>
    <p class="lead">Descubra as nossas delícias artesanais</p>

    <ul class="nav nav-tabs mt-4 justify-content-center border-0" id="menuTabs" role="tablist">
        <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#bebidas">Bebidas</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#comidas">Comidas</button></li>
    </ul>
</div>

        <div class="tab-content">
            <!-- BEBIDAS: 9 Cards com Preço -->
            <div class="tab-pane fade show active" id="bebidas">
                <div class="row g-4">
                    <script>
                        const bebidas = [
                        { nome: "PUMPKIN SPICE LATTE “MIAUVILHOSO”", preco: "3.50€", imagem: "assets/imagens/PUMPKINSPICELATTE.png" },
                        { nome: "CHÁ PRETO “NOITE DE GATO", preco: "1.20€", imagem: "assets/imagens/cha.png" },
                        { nome: "Chá das Cinco Bigodes", preco: "3.00€", imagem: "assets/imagens/das5.png" },
                        { nome: "Chá Verde", preco: "2.00€", imagem: "assets/imagens/cha.png" },
                        { nome: "Mocha Mia de Caramelo", preco: "2.80€", imagem: "assets/imagens/1.png" },
                        { nome: "Frappé Bigode Branco", preco: "3.20€", imagem: "assets/imagens/2.png" },
                        { nome: "Matcha-Gato Gelado", preco: "3.80€", imagem: "assets/imagens/3.png" },
                        { nome: "Pink Panther Lemonade", preco: "2.50€", imagem: "assets/imagens/caramelo.png" },
                        { nome: "MEOW-CHIATO", preco: "1.50€", imagem: "assets/imagens/lattecafe.png" }
                        ];
                        bebidas.forEach(item => {
                        document.write(`
                            <div class="col-md-4">
                                <div class="card h-100 shadow-sm">
                                    <img src="${item.imagem}" class="card-img-top img-fluid" alt="${item.nome}" style="height: 200px; object-fit: cover;">
                                    <div class="card-body d-flex flex-column">
                                        <h5 class="card-title">${item.nome}</h5>
                                        <p class="card-text flex-grow-1">Bebida artesanal preparada na hora.</p>
                                        <p class="card-text fw-bold" style="color: var(--neko-café-escuro);">${item.preco}</p>
                                    </div>
                                </div>
                            </div>`);
                    });
                    </script>
                </div>
            </div>
            
            <!-- COMIDAS: 9 Itens em Tabela Responsiva -->
            <div class="tab-pane fade" id="comidas">
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr><th>Produto</th><th>Descrição</th><th>Preço</th></tr>
                        </thead>
                        <tbody>
                            <script>
                                const comidas = [
                                    { nome: "Cookie Pata", preco: "1.50€" }, { nome: "Bolo Neko", preco: "2.50€" },
                                    { nome: "Tosta Mista", preco: "3.00€" }, { nome: "Croissant", preco: "1.20€" },
                                    { nome: "Muffin", preco: "2.00€" }, { nome: "Brownie", preco: "2.20€" },
                                    { nome: "Sandes Vegan", preco: "4.00€" }, { nome: "Scone", preco: "1.80€" },
                                    { nome: "Panquecas", preco: "4.50€" }
                                ];
                                comidas.forEach(item => {
                                    document.write(`<tr><td>${item.nome}</td><td>Delicioso e fresco</td><td>${item.preco}</td></tr>`);
                                });
                            </script>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="py-4 text-center text-white" style="background-color: #4E342E;">
        <p>Café Premium & Aperitivos MEOW! | Rua dos Ronronares</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
